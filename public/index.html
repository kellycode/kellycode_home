<!DOCTYPE html>
<html class="no_js">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="initial-scale=1.0, width=device-width" />
        <meta name="description" content="KellyCode" />
        <meta name="keywords" content="Retired Web Dev" />
        <meta name="author" content="KellyCode" />
        <title>KellyCode</title>
        <link rel="shortcut icon" href="./favicons/favicon.ico" />
        <!-- site styles -->
        <link href="css/kellycode.css" rel="stylesheet" type="text/css" />
        <!-- js ext -->
        <script src="js/vendor/modernizr/modernizr-custom.js"></script>
        <script src="js/vendor/jquery/jquery-3.3.1.min.js"></script>
        <!-- js local -->
        <script src="js/kellycode_utils.js"></script>
        <!-- for Modernizr -->
        <script>
            $("html").removeClass("no_js").addClass("has_js");

            if (Modernizr.touch) {
                $("html").addClass("has_touch");
            } else {
                $("html").addClass("no_touch");
            }
        </script>
    </head>

    <body style="background-color: black">
        <!-- just an iFrame pulling in a project from Github -->
        <iframe
            aria-label="Just displaying a github project"
            name="k_iframe"
            id="kellycode_iframe"
            src="https://kellycode.github.io/dedsec-screen-mockup/"
            height="100%"
            width="100%"
            frameborder="0"
        ></iframe>

        <!--src="./test_site/index.html"-->

        <!-- sidebar and it's icons -->
        <div id="leftSideBar" class="hide_icons">
            <!-- kellycode logo -->
            <a
                id="siteLogo"
                class="hidden_icon hovering_rt"
                href="https://kellycode.github.io/dedsec-screen-mockup/"
                target="k_iframe"
            >
                <img id="siteLogo" class="hovering_rt" src="img/kellycode_logo_sm.png" alt="" />
            </a>

            <!-- github link -->
            <a id="github" class="hidden_icon hovering_rt" href="https://github.com/kellycode/" target="_blank">
                <span class="name_tooltip">KellyCode Github</span>
                <svg
                    class="octicon octicon-mark-github"
                    viewBox="0 0 16 16"
                    version="1.1"
                    height="40"
                    width="40"
                    aria-hidden="false"
                >
                    <path
                        class=""
                        fill-rule="evenodd"
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                    ></path>
                </svg>
            </a>

            <!-- unity webgl solitaire game link to local iframe -->
            <a
                id="solitaire1"
                class="desktop_only game hidden_icon hovering_rt"
                href="https://kellycode.github.io/unity-webgl-solitaire/"
                target="k_iframe"
            >
                <span class="name_tooltip">WebGL Solitaire</span>
                <img src="img/card.png" alt="Solitaire" />
            </a>

            <!-- old school bejeweled style game link to local iframe -->
            <a
                id="bevegged"
                class="desktop_only game hidden_icon hovering_rt"
                href="https://kellycode.github.io/be-vegged/"
                target="k_iframe"
            >
                <span class="name_tooltip">Be Vegged Match Game</span>
                <img src="img/tomato.png" alt="Be Vegged" />
            </a>
        </div>

        <script>
            // if we're on a touch device, add a
            // click handler where using a hover css
            if (Modernizr.touchevents) {
                $("#siteLogo").click(function () {
                    $("#leftSideBar").toggleClass("hide_icons show_icons");
                });
            }
            // sets an orientation class on the body tag
            KELLYCODE_UTILS.screenWatch(window);
        </script>
    </body>
</html>
