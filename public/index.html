<!DOCTYPE html>
<html>
    <head>
        <!-- standard meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <meta name="description" content="KellyCode Web Development">
        <meta name="keywords" content="Javascript Developer. Web Developer, Angular Developer">
        <meta name="author" content="Kearnan Kelly & KellyCode">
        <title>KellyCode - Web Development</title>

        <!-- site icons -->
        <link rel="icon" href="favicon.ico">
        <link rel='shortcut icon' type='image/x-icon' href='favicon.ico' />
        <link rel="shortcut icon" type="image/png" href="favicon.png"/>
        <link rel="apple-touch-icon" href="favicons/apple-touch-icon.png" sizes="180x180">
        <link rel="icon" href="favicons/favicon-32x32.png" sizes="32x32" type="image/png">
        <link rel="icon" href="favicons/favicon-16x16.png" sizes="16x16" type="image/png">

        <!-- site css -->
        <link href="css/kellycode.css" rel="stylesheet" type="text/css"/>
        <link href="css/kellycode_utils.css" rel="stylesheet" type="text/css"/>

        <!-- bootstrap css -->
        <link href="css/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css"/>

        <!-- javascript dependencies -->
        <script src="js/vendor/modernizr/modernizr-custom.js" type="text/javascript"></script>
        <script src="js/vendor/jquery/jquery-3.3.1.min.js" type="text/javascript"></script>
        <script src="js/vendor/angular/angular.min.js" type="text/javascript"></script>

        <!-- javascript ours -->
        <script src="js/kellycode_contact.js" type="text/javascript"></script>
        <script src="js/kellycode_utils.js" type="text/javascript"></script>

        <!-- check for js for css effect but not using atm -->
        <script>
            $('html').removeClass('no_js').addClass('has_js');
        </script>

    </head>
    <body>

        <!-- iFrame pulling in a project atm from Github -->
        <iframe id="animated_bg" src="https://kellycode.github.io/canvas_clouds/" ></iframe>

        <!-- sidebar and it's icons -->
        <div id="leftSideBar" class='show_icons'>

            <img id="siteLogo" class="" src="img/kellycode_logo_sm.png" alt="">

            <a id="github" class="hidden_icon hovering_rt" href="https://github.com/kellycode/">
                <svg class="octicon octicon-mark-github" viewBox="0 0 16 16" version="1.1" height="40" width="40" aria-hidden="false">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
            </a>

            <span class="kellycode_hover_text">
                Github
            </span>

            <!--        TODO Update eventually -->
            <div id="chatButton" class="hidden_icon hovering_rt" >
                <img data-toggle="modal" data-target="#kContactCenter" src="img/chat_img.png" alt=""/>
            </div>

            <span class="kellycode_hover_text">
                Send a messege
            </span>

            <a id="discordLink" class="hidden_icon hovering_rt" href="https://discord.gg/EB9vtyY">
                <svg xmlns="http://www.w3.org/2000/svg" aria-label="Discord" role="img" viewBox="0 0 512 512" height="40" width="40" >
                <rect width="512" height="512" rx="15%"/>
                <path d="m346 392-21-25c41-11 57-39 57-39-52 49-194 51-249 0 0 0 14 26 56 39l-23 25c-70-1-97-48-97-48 0-104 46-187 46-187 47-33 90-33 90-33l3 4c-58 16-83 42-83 42 68-46 208-42 263 0 1-1-33-28-86-42l5-4s43 0 90 33c0 0 46 83 46 187 0 0-27 47-97 48z" fill="#fff"/>
                <ellipse cx="196" cy="279" rx="33" ry="35"/>
                <ellipse cx="312" cy="279" rx="33" ry="35"/>
                </svg>
            </a>

            <span class="kellycode_hover_text">
                Kellycode Discord
            </span>

        </div>

        <!-- Top 50px x 100% header -->
        <div class="header_content">
            <span class="site_name">KellyCode</span>
        </div>

        <div class="footer_content">
            <span id="contactNotify" class=""></span>
        </div>

        <!-- Pop-in-out display contact form -->
        <section id="contactWrap" ng-app="contactApp">
            <div id="kContact" ng-controller="ContactController" ng-class="{ 'contact_shown' : isVisible }" >
                <section>
                    <form id="kContactForm" name="contactForm" ng-submit="processForm();">
                        <div class="form-group">
                            <div id="kContactTitle">
                                <h5>Contact KellyCode</h5>
                            </div>
                            <div>

                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text" id="basic-addon1">Name&nbsp;&nbsp;&nbsp;&nbsp;</span>
                                    </div>
                                    <input type="text" class="form-control" ng-model="formData.username" placeholder="Your name" aria-label="Your name" aria-describedby="basic-addon1" required>
                                </div>

                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">Message</span>
                                    </div>
                                    <textarea id="kContactText" style="resize: none;" type="text" name="contentText" ng-model="formData.content" class="form-control" required></textarea>
                                </div>


                            </div>
                            <div class="modal-footer">
                                <button type="button" id='contact_cancel' class="btn btn-secondary" ng-click='cancel();'>Cancel</button>
                                <button type="submit" class="btn btn-primary" ng-disabled="contactForm.$invalid">Submit</button>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </section>

        <script>
            KELLYCODE_UTILS.Tooltip.init();
            // if we're on a touch device, add a
            // click handler where using a hover css
            if (Modernizr.touchevents) {
                $("#leftSideBar").click(function () {
                    $(this).toggleClass("hide_icons show_icons");
                });
            }
        </script>

    </body>
</html>
