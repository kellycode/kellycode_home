    </head>
    <body>

        <!-- iFrame pulling in a project from Github -->
        <iframe aria-label="Just displaying a github project" id="kellycode_iframe" src="https://kellycode.github.io/flag-waving/" height="100%" width="100%" frameborder="0"></iframe>

        <!-- sidebar and it's icons -->
        <div id="leftSideBar" class='hide_icons'>

            <!-- kellycode logo -->
            <img id="siteLogo" class="hovering_rt" src="img/kellycode_logo_sm.png" alt="">
            <span class="kellycode_hover_text">
                KellyCode
            </span>

            <!-- github link -->
            <a id="github" class="hidden_icon hovering_rt" href="https://github.com/kellycode/" target="_blank">
                <svg class="octicon octicon-mark-github" viewBox="0 0 16 16" version="1.1" height="40" width="40" aria-hidden="false">
                <path class="" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
            </a>
            <span class="kellycode_hover_text">
                Github
            </span>

            <!-- discord link -->
            <a id="discordLink" class="hidden_icon hovering_rt" href="https://discord.gg/EB9vtyY" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" aria-label="Discord" role="img" viewBox="0 0 512 512" height="40" width="40" >
                <rect width="512" height="512" rx="15%"/>
                <path d="m346 392-21-25c41-11 57-39 57-39-52 49-194 51-249 0 0 0 14 26 56 39l-23 25c-70-1-97-48-97-48 0-104 46-187 46-187 47-33 90-33 90-33l3 4c-58 16-83 42-83 42 68-46 208-42 263 0 1-1-33-28-86-42l5-4s43 0 90 33c0 0 46 83 46 187 0 0-27 47-97 48z" fill="#fff"/>
                <ellipse cx="196" cy="279" rx="33" ry="35"/>
                <ellipse cx="312" cy="279" rx="33" ry="35"/>
                </svg>
            </a>
            <span class="kellycode_hover_text">
                Kellycode Discord
            </span>

            <!-- chat dialog trigger -->
            <div id="chatButton" class="hidden_icon hovering_rt" >
                <img data-toggle="modal" data-target="#kContactCenter" src="img/chat_img.png" alt=""/>
            </div>
            <span class="kellycode_hover_text">
                Send a messege
            </span>
        </div>

        <div class="header_content">
            <span id="contactNotify" class=""></span>
        </div>

        <!-- Pop-in-and-out display contact form -->
        <section id="contactWrap" ng-app="contactApp">
            <div id="kContact" ng-controller="ContactController" ng-class="{ 'contact_shown' : isVisible }" >
                <section>
                    <form id="kContactForm" name="contactForm" ng-submit="processForm();">
                        <div class="form-group">
                            <div id="kContactTitle">
                                <h5>Contact KellyCode</h5>
                            </div>
                            <div>

                                <div class="input-group mb-3">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text" id="basic-addon1">Name&nbsp;&nbsp;&nbsp;&nbsp;</span>
                                    </div>
                                    <input type="text" class="form-control" ng-model="formData.username" placeholder="Your name" aria-label="Your name" aria-describedby="basic-addon1" required>
                                </div>

                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">Message</span>
                                    </div>
                                    <textarea id="kContactText" style="resize: none;" type="text" name="contentText" ng-model="formData.content" class="form-control" required></textarea>
                                </div>


                            </div>
                            <div class="modal-footer">
                                <button type="button" id='contact_cancel' class="btn btn-secondary" ng-click='cancel();'>Cancel</button>
                                <button type="submit" class="btn btn-primary" ng-disabled="contactForm.$invalid">Submit</button>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </section>

        <script>
            // if we're on a touch device, add a
            // click handler where using a hover css
            if (Modernizr.touchevents) {
                $("#siteLogo").click(function () {
                    $("#leftSideBar").toggleClass("hide_icons show_icons");
                });
            }
            else {
                KELLYCODE_UTILS.Tooltip.init();
            }

            KELLYCODE_UTILS.screenWatch(window);

        </script>

    </body>
</html>
